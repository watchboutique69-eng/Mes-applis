<title>Cadeaux en famille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600&display=swap">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout : une colonne étroite façon carnet, barre d'onglets en bas (usage téléphone), étiquette cadeau pour le tirage */
/* Thème « Pastel joyeux » : fond pêche, prune pour les actions, rose framboise pour Noël et « toi »,
   miel pour les prix et cagnottes, menthe pour les enfants. Toujours clair, quel que soit le réglage du téléphone. */
:root{
  --bg:#FFF6EF; --surface:#FFFFFF; --ink:#3B2A3F; --muted:#7A6680; --line:#F1DED2;
  --ribbon:#C9375F; --ribbon-soft:#FFDDE4; --gold:#8F6200; --gold-soft:#FFF0C2;
  --pine:#5B2D6B; --pine-soft:#EDE0FF; --on-accent:#FFFFFF;
  --mint:#1F7A4F; --mint-soft:#D9F4E6;
  --f-display:"Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body:"Baloo 2", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
  --r:22px;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:580px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
a{color:var(--pine)}

/* En-tête */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.55rem;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.me-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;display:flex;gap:6px;align-items:center}
.me-btn b{font-weight:600}
.me-btn.unset{border-color:var(--ribbon);color:var(--ribbon)}
.countdown{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:5px 11px;border-radius:999px;background:var(--pine-soft);color:var(--pine);font-weight:600;font-variant-numeric:tabular-nums}
.chip.red{background:var(--ribbon-soft);color:var(--ribbon)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}

.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 0 12px}
.sec-head h2{font-family:var(--f-display);font-size:1.25rem;font-weight:400}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--pine);color:var(--on-accent)}
.btn.red{background:var(--ribbon)}
.btn.ghost{background:transparent;color:var(--pine);border:1px solid var(--line)}
.btn.small{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn.danger{background:transparent;color:var(--ribbon);border:1px solid var(--ribbon)}
.btn.danger.armed{background:var(--ribbon);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:default}
.link-btn{border:0;background:none;color:var(--pine);font-weight:600;padding:4px 0}

/* Famille */
.family{display:flex;flex-direction:column;gap:10px}
.house{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;background:none;border:0;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row.kid{padding-left:30px}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1rem;background:var(--pine-soft);color:var(--pine)}
.kid .avatar{width:30px;height:30px;font-size:.85rem;background:var(--gold-soft);color:var(--gold)}
.row-main{flex:1;min-width:0}
.row-name{font-weight:600}
.row-meta{font-size:.84rem;color:var(--muted)}
.chev{color:var(--muted)}
.you{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ribbon);margin-left:6px}

/* Page personne */
.back{margin-top:6px}
.person-head{display:flex;gap:14px;align-items:center;margin-top:12px}
.person-head .avatar{width:54px;height:54px;font-size:1.4rem}
.person-head h2{font-family:var(--f-display);font-weight:400;font-size:1.6rem}
.note{font-size:.88rem;color:var(--muted);background:var(--pine-soft);border-radius:10px;padding:10px 12px;margin-top:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem}
.filter[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.wishes{display:flex;flex-direction:column;gap:10px}
.wish{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.wish.taken{background:transparent;border-style:dashed}
.wish.taken .wish-title{color:var(--muted)}
.wish-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.wish-title{font-weight:600;font-size:1.02rem;min-width:0;overflow-wrap:anywhere}
.wish-price{font-variant-numeric:tabular-nums;font-weight:600;color:var(--gold);white-space:nowrap}
.wish-note{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.wish-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag-occ{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--pine-soft);color:var(--pine)}
.tag-occ.noel{background:var(--ribbon-soft);color:var(--ribbon)}
.tag-occ.anniv{background:var(--gold-soft);color:var(--gold)}
.status{font-size:.85rem;font-weight:600}
.status.mine{color:var(--pine)}
.status.other{color:var(--muted)}

.empty{text-align:center;padding:34px 18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty h3{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:1.2rem;margin-bottom:6px}
.empty .btn{margin-top:14px}

/* Tirage */
.draw{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.draw h3{font-family:var(--f-display);font-weight:400;font-size:1.3rem}
.draw-meta{font-size:.86rem;color:var(--muted)}
.draw-actions{display:flex;gap:8px;flex-wrap:wrap}
.giftag{position:relative;align-self:flex-start;min-width:250px;max-width:100%;padding:16px 22px 16px 58px;background:var(--gold-soft);color:var(--ink);
  clip-path:polygon(34px 0,100% 0,100% 100%,34px 100%,0 50%);transform:rotate(-2deg);transform-origin:left center;animation:swing .9s ease-out}
.giftag::before{content:"";position:absolute;left:22px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--gold)}
.giftag .lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}
.giftag .hand{font-family:var(--f-hand);font-size:1.9rem;line-height:1.05}
.giftag .line{display:flex;gap:10px;align-items:baseline}
@keyframes swing{0%{transform:rotate(-9deg)}60%{transform:rotate(1deg)}100%{transform:rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){.giftag{animation:none}}
.reveal{border:2px dashed var(--gold);background:transparent;border-radius:12px;padding:16px;color:var(--gold);font-weight:700;font-size:1rem}
.pairs{width:100%;border-collapse:collapse;font-size:.92rem}
.pairs td{padding:7px 4px;border-top:1px solid var(--line)}
.pairs td:nth-child(2){color:var(--muted);text-align:center;width:28px}

/* Dates */
.dates{display:flex;flex-direction:column;gap:8px}
.date-row{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%;text-align:left}
.date-row.xmas{background:var(--ribbon-soft);border-color:transparent}
.cal{flex:none;width:52px;text-align:center;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.cal .m{font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--ribbon);color:var(--on-accent);padding:2px 0}
.cal .d{font-family:var(--f-display);font-size:1.35rem;line-height:1.35;font-variant-numeric:tabular-nums}
.in{margin-left:auto;font-weight:700;font-size:.9rem;color:var(--pine);white-space:nowrap;font-variant-numeric:tabular-nums}
.in.soon{color:var(--ribbon)}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs-in{display:flex;max-width:580px;width:100%}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.76rem;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ribbon)}

/* Feuille (formulaires) */
.sheet-bg{position:fixed;inset:0;background:rgba(10,18,16,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:580px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin-bottom:14px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.field .lab{font-size:.84rem;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=url],.field input[type=date],.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:10px;font-weight:600;color:var(--muted);cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + span{color:var(--ink)}
.seg label:has(input:checked){background:var(--pine-soft);color:var(--pine)}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;gap:10px;align-items:center;padding:8px 2px}
.check input{width:20px;height:20px;accent-color:var(--pine)}
.excl{display:flex;gap:6px;align-items:center}
.excl select{flex:1;min-width:0}
.form-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:6px}
.form-actions .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--ribbon);font-size:.88rem;font-weight:600}
.pick{display:flex;flex-direction:column;gap:8px}
.pick .row{border:1px solid var(--line);border-radius:12px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
</style>

<style>
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;margin-top:22px}
.welcome h2{font-family:var(--f-display);font-weight:400;font-size:1.4rem;margin-bottom:6px}
.welcome p{color:var(--muted);margin:0 0 16px}
.lock{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--muted)}
.lock svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--gold)}
.me-btn.static{cursor:default}
.google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.google svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.addr{font-weight:700;font-size:1.05rem;background:var(--gold-soft);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere;user-select:all}
.acct{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;font-size:.88rem}
.acct .muted{overflow-wrap:anywhere;min-width:0}
.acct-btns{display:flex;gap:14px}
.acc-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px}
.acc-row + .acc-row{border-top:1px solid var(--line)}
.acc-mail{font-weight:600;overflow-wrap:anywhere;min-width:0}
.hist{margin-top:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 14px}
.hist summary{cursor:pointer;padding:14px 0;font-weight:700;color:var(--ink);list-style:none;display:flex;justify-content:space-between;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.hist summary::after{content:"›";font-size:1.3rem;color:var(--muted);transition:transform .15s}
.hist[open] summary::after{transform:rotate(90deg)}
.hist-year{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);padding:10px 0 4px;border-top:1px solid var(--line)}
.hist-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.hist-row + .hist-row{border-top:1px dashed var(--line)}
.hist > .u-msg{margin-top:0}
.settle{margin-top:6px}
.settle .house{margin-top:10px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr));margin:0}
.given-all{margin:4px 0 14px}
.btn.ghost.armed{background:var(--pine);color:var(--on-accent)}
.tick:disabled{opacity:.6;cursor:default}
.wish .tags .link-btn + .link-btn{margin-left:10px}
.fete-row .row-name{color:var(--ribbon)}
.pot-link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--gold);background:var(--gold-soft);color:var(--ink)}
.pot-link .row-name{color:var(--gold);font-weight:700}
.mini-bar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px;max-width:220px}
.mini-bar span{display:block;height:100%;background:var(--gold);border-radius:3px}
.fete-av{background:var(--ribbon-soft)!important;color:var(--ribbon)!important}
.fete-pot{margin-top:16px;padding:14px;gap:10px}
.parts{display:flex;flex-direction:column}
.part{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.vis{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:700}
.vis.on{border-style:solid;border-color:var(--gold);color:var(--gold)}

.like.on{background:var(--ribbon-soft);color:var(--ribbon);border-color:var(--ribbon)}

/* ================================================ */
/* Données :
   members/<uid>                profil adulte {name, birthday, pubKey}      (chacun écrit le sien)
   members/<uid>/kids/<id>      enfants de cet adulte                      (seul le parent écrit)
   members/<uid>/wishes/<id>    idées {personId: uid ou id enfant, …}     (seul l'auteur de la liste écrit)

   draws/<id>                   {participants, exclusions, sealed:{uid: résultat chiffré}}
   data/users/<uid>/keys        clé privée, lisible par son seul propriétaire */
const S = { db:null, uid:null, offline:false, noId:false,
  members:{}, kids:{}, wishes:{}, resa:{}, draws:[],
  loaded:{members:false, resa:false, draws:false}, subs:new Set(),
  priv:null, tab:'listes', personId:null, filter:'all', confirm:null, opened:{}, opening:{}, busy:false, privChecked:false };

const LS = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v) }catch(e){} } };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byName = (a,b) => (a.name||'').localeCompare(b.name||'', 'fr');
const initial = n => (n||'?').trim().charAt(0).toUpperCase();
const MONTHS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MONTHS_L = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const OCC = { both:'Toutes occasions', noel:'Noël', anniv:'Anniversaire', fete:'Fête des mères / pères', naissance:'Naissance', autre:'Autre occasion' };
const OCC_ORDER = ['noel','anniv','fete','naissance','autre'];

/* ---------- Modèle ---------- */
function people(){
  const out = [];
  for(const [uid,m] of Object.entries(S.members)) {
    out.push({ id:uid, owner:uid, kind:'adult', name:m.name, birthday:m.birthday, pubKey:m.pubKey, fiche:m.fiche||{}, open:m.open });
    for(const k of (S.kids[uid]||[])) out.push({ id:k.id, owner:uid, kind:'child', parentId:uid, name:k.name, birthday:k.birthday, fiche:k.fiche||{}, open:k.open });
  }
  return out;
}
const person = id => people().find(p => p.id === id);
const pname = id => person(id)?.name || 'Quelqu’un';
const adults = () => people().filter(p => p.kind==='adult').sort(byName);
const kidsOf = uid => (S.kids[uid]||[]).map(k => person(k.id)).filter(Boolean).sort(byName);
const allWishes = () => Object.entries(S.wishes).flatMap(([owner,ws]) => ws.map(w => ({...w, owner})));
const wishKey = w => w.owner + '~' + w.id;
/* Réservations : resa/<uid>.items["<owner>~<wishId>"] = {mode:'solo'|'group', amount, bought}
   resa/<uid>.extras[id] = {to, title, price, bought}  (cadeaux hors liste) */
const normItem = v => v===true ? {mode:'solo'} : (v && typeof v==='object' ? v : null);
function claims(w){ const k = wishKey(w), out = []; for(const [uid,r] of Object.entries(S.resa)){ const it = normItem(r.items && r.items[k]); if(it) out.push({uid, ...it}); } return out; }
const showDefault = () => !!(S.members[S.uid] && S.members[S.uid].showNames);
const soloClaim = w => claims(w).find(c => c.mode !== 'group') || null;
/* Date à laquelle un cadeau marqué « Offert » est considéré comme reçu : la fête qui suit (jamais avant, pour garder la surprise) */
function deliveryDate(w, givenAt){
  const t = new Date(givenAt); const T = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  const onOrAfter = fn => { let d = fn(T.getFullYear()); if(d < T) d = fn(T.getFullYear() + 1); return d; };
  const p = person(w.personId); let bd = null;
  if(p && p.birthday){ const [, m, dd] = p.birthday.split('-').map(Number); if(m && dd) bd = onOrAfter(y => new Date(y, m-1, dd)); }
  const xm = onOrAfter(y => new Date(y, 11, 25));
  const occ = w.occasion || 'both';
  if(occ === 'noel') return xm;
  if(occ === 'anniv') return bd || xm;
  if(occ === 'fete'){ const a = onOrAfter(feteMeres), b = onOrAfter(fetePeres); return a < b ? a : b; }
  if(occ === 'naissance' || occ === 'autre') return T;
  return bd && bd < xm ? bd : xm;
}
function autoReceived(w){
  let best = 0;
  for(const c of claims(w)){
    if(!c.given || !c.givenAt) continue;
    if(w.restoredAt && w.restoredAt > c.givenAt) continue;
    const d = deliveryDate(w, c.givenAt);
    if(today() >= d) best = Math.max(best, d.getTime());
  }
  return best;
}
const isReceived = w => !!w.received || !!autoReceived(w);
const receivedAtOf = w => w.receivedAt || autoReceived(w) || 0;
function reservedBy(w){ const s = claims(w).find(c => c.mode!=='group'); return s ? s.uid : null; }
const groupOf = w => claims(w).filter(c => c.mode==='group');
const isTaken = w => claims(w).length > 0;
function myResa(){ const r = S.resa[S.uid] || {}; return { items:{...(r.items||{})}, extras:{...(r.extras||{})} }; }
const saveResa = (r, msg) => write(()=>S.db.doc('resa/'+S.uid).set(r), msg);
function parsePrice(s){ const m = String(s||'').replace(/\s/g,'').replace(',', '.').match(/\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }
const priceLabel = p => /^\s*\d+([.,]\d+)?\s*$/.test(String(p||'')) ? String(p).trim() + ' €' : p;
const eur = n => (n||0).toLocaleString('fr-FR', {style:'currency', currency:'EUR', minimumFractionDigits: n%1 ? 2 : 0, maximumFractionDigits: 2});
const canEdit = p => p && p.owner === S.uid;
const isMe = p => p && p.id === S.uid;

function today(){ const n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function nextDate(month, day){ const t=today(); let d=new Date(t.getFullYear(), month, day); if(d<t) d=new Date(t.getFullYear()+1, month, day); return d; }
const daysTo = d => Math.round((d - today())/864e5);
const inLabel = n => n===0 ? "Aujourd’hui" : n===1 ? 'Demain' : n===-1 ? 'Hier' : n < 0 ? `il y a ${-n} j` : `dans ${n} j`;
function bday(p){
  if(!p.birthday) return null;
  const [y,m,d] = p.birthday.split('-').map(Number); if(!m||!d) return null;
  const next = nextDate(m-1,d);
  return { next, days:daysTo(next), age: y ? next.getFullYear()-y : null, day:d, month:m-1 };
}
const xmas = () => { const d=nextDate(11,25); return {date:d, days:daysTo(d)}; };

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true, 2800); }
async function write(fn, ok){
  if(!S.db || !S.uid){ toast("Connecte-toi pour modifier."); return false; }
  try{ await fn(); if(ok) toast(ok); return true; }
  catch(e){
    const c = e && e.code;
    if(c==='permission-denied') toast("Modification refusée : ton accès n’est peut-être plus autorisé.");
    else if(c==='unavailable') toast("Pas de connexion internet. Réessaie dans un instant.");
    else if(c==='resource-exhausted') toast("Limite gratuite du jour atteinte. Réessaie demain.");
    else toast("L’enregistrement a échoué. Réessaie dans un instant.");
    return false;
  }
}

/* ---------- Chiffrement du tirage ----------
   Chaque adulte a une paire de clés. La clé publique est dans son profil,
   la clé privée dans son espace privé (personne d'autre, Florian compris, ne peut la lire).
   Le résultat de chacun est chiffré avec SA clé publique : lui seul peut l'ouvrir. */
const ALG = { name:'RSA-OAEP', hash:'SHA-256' };
async function genKeys(){
  const k = await crypto.subtle.generateKey({ ...ALG, modulusLength:2048, publicExponent:new Uint8Array([1,0,1]) }, true, ['encrypt','decrypt']);
  return { pub: await crypto.subtle.exportKey('jwk', k.publicKey), priv: await crypto.subtle.exportKey('jwk', k.privateKey) };
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function seal(pubJwk, obj){
  const key = await crypto.subtle.importKey('jwk', pubJwk, ALG, false, ['encrypt']);
  return b64(await crypto.subtle.encrypt(ALG, key, new TextEncoder().encode(JSON.stringify(obj))));
}
async function unseal(txt){
  if(!S.priv) throw new Error('nokey');
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt(ALG, S.priv, unb64(txt))));
}
async function loadPriv(){
  const snap = await S.db.doc(`data/users/${S.uid}/keys`).get();
  const jwk = snap.exists ? snap.data().priv : null;
  S.priv = jwk ? await crypto.subtle.importKey('jwk', jwk, ALG, false, ['decrypt']) : null;
  return !!S.priv;
}
async function newKeys(){
  const { pub, priv } = await genKeys();
  await S.db.doc(`data/users/${S.uid}/keys`).set({ priv, createdAt:Date.now() });
  S.priv = await crypto.subtle.importKey('jwk', priv, ALG, false, ['decrypt']);
  return pub;
}

/* ---------- Icônes ---------- */
const ICON = {
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="9" width="17" height="11.5" rx="1.5"/><path d="M2.5 9h19V6.5h-19zM12 6.5v14M12 6.5C10 3 6.5 3.5 7.5 6M12 6.5c2-3.5 5.5-3 4.5-.5"/></svg>',
  draw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3.5c3 0 5 10 9 10H20M4 17h3.5c1.5 0 2.7-2 3.8-4.5M16.5 7H20M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5M13 9.5C14 8 15 7 16.5 7"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12.5H6z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>'
};

/* ---------- Rendu ---------- */
function render(){
  const keep = {}; document.querySelectorAll('#app input[id], #app textarea[id]').forEach(i => { if(i.type!=='checkbox' && i.type!=='radio') keep[i.id] = i.value; });
  const focusId = document.activeElement && document.activeElement.closest && document.activeElement.closest('#app') ? document.activeElement.id : null;
  const restore = () => { for(const [id,v] of Object.entries(keep)){ const el = document.getElementById(id); if(el && v && !el.value) el.value = v; } if(focusId){ const el = document.getElementById(focusId); if(el) el.focus(); } };
  const gate = gateView();
  document.querySelector('.tabs').hidden = !!gate;
  if(gate){
    document.getElementById('app').innerHTML = `<header class="top"><h1 class="brand">Cadeaux en famille<small>Listes · tirage · anniversaires</small></h1></header>` + gate;
    restore(); mountAuth(); return;
  }
  document.getElementById('tabs').innerHTML = [['listes','Listes',ICON.list],['achats','Achats',ICON.bag],['tirage','Tirage',ICON.draw],['dates','Dates',ICON.cal]]
    .map(([k,l,i]) => `<button class="tab" data-action="tab" data-tab="${k}" ${S.tab===k?'aria-current="page"':''}>${i}${l}</button>`).join('');
  const loaded = S.loaded.members && S.loaded.resa && S.loaded.draws;
  let body;
  if(S.offline) body = `<div class="empty"><h3>Données inaccessibles</h3>Vérifie ta connexion internet, puis recharge la page.</div>`;
  else if(!loaded) body = `<div class="loading">Chargement des listes…</div>`;
  else if(S.uid && !S.members[S.uid]) body = viewWelcome();
  else if(S.fete) body = viewFete(S.fete);
  else if(S.tab==='listes') body = S.personId && person(S.personId) ? viewPerson(person(S.personId)) : viewFamily();
  else if(S.tab==='tirage') body = viewDraws();
  else if(S.tab==='achats') body = viewAchats();
  else body = S.fete ? viewFete(S.fete) : viewDates();
  document.getElementById('app').innerHTML = header() + body;
  restore(); mountWelcome();
}

function header(){
  const x = xmas(); const m = S.members[S.uid];
  const up = people().map(p=>({p,b:bday(p)})).filter(o=>o.b).sort((a,b)=>a.b.days-b.b.days)[0];
  const who = m ? `<button class="me-btn" data-action="edit-me">Connecté : <b>${esc(m.name)}</b></button>`
    : '';
  return `<header class="top"><h1 class="brand">Cadeaux en famille<small>Listes · tirage · anniversaires</small></h1>${who}</header>
  <div class="countdown"><span class="chip red">Noël ${x.days===0?"aujourd’hui":'dans '+x.days+' jours'}</span>
    ${up?`<span class="chip gold">Anniv. de ${esc(up.p.name)} ${up.b.days===0?"aujourd’hui":'dans '+up.b.days+' j'}</span>`:''}</div>
`;
}

function viewWelcome(){
  return `<section class="welcome"><h2>Bienvenue !</h2>
    <p>Crée ton profil une seule fois. Il est lié à ton compte : toi seul pourras modifier ta liste et celles de tes enfants.</p>
    <form class="form" id="wf-me">
      <div class="field"><label for="me-name">Ton prénom</label><input type="text" id="me-name" required maxlength="40" autocomplete="given-name"></div>
      <div class="field"><label for="me-bday">Ta date de naissance (pour les anniversaires)</label><input type="date" id="me-bday"></div>
      <div class="err" id="me-err" hidden></div>
      <button class="btn" type="submit" id="me-go">Créer mon profil</button>
      <p class="muted" style="margin:0">${esc(S.email||'')} · <button type="button" class="link-btn" data-action="logout">Se déconnecter</button></p>
    </form></section>`;
}
function mountWelcome(){
  const f = document.getElementById('wf-me'); if(!f || f.dataset.m) return; f.dataset.m = 1;
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('me-name').value.trim(); if(!name) return;
    const go = document.getElementById('me-go'); go.disabled = true; go.textContent = 'Création…';
    const ok = await write(async () => {
      const pub = await newKeys();
      await S.db.doc('members/'+S.uid).set({ name, birthday: document.getElementById('me-bday').value || null, pubKey: pub, createdAt: Date.now() });
    }, `Bienvenue ${name} !`);
    if(!ok){ go.disabled=false; go.textContent='Créer mon profil'; }
  });
}

function wishCount(p){
  const ws = allWishes().filter(w => w.personId===p.id && !isReceived(w));
  if(!ws.length) return 'Aucune idée pour l’instant';
  const free = ws.filter(w => !isTaken(w)).length;
  return `${ws.length} idée${ws.length>1?'s':''}` + (isMe(p) ? '' : ` · ${free} libre${free>1?'s':''}`);
}

function viewPerson(p){

  const occs = OCC_ORDER.filter(o => all.some(w => w.occasion===o));

function groupState(w){
  const g = groupOf(w), buyer = g.find(c => c.bought) || null;
  const debts = buyer ? g.filter(c => c.uid !== buyer.uid).map(c => ({ uid:c.uid, amount:+c.amount||0, paid: !!c.repaid || !!(buyer.gotFrom && buyer.gotFrom[c.uid]) })) : [];
  return { g, buyer, debts };
}
function groupHTML(w){
  const g = groupOf(w); if(!g.length) return '';
  const { debts } = groupState(w);
  const inside = g.some(c => c.uid === S.uid);   // les noms ne sont montrés qu'aux participants (secret du tirage)
  const total = g.reduce((s,c)=>s+(+c.amount||0),0), target = parsePrice(w.price);
  const pct = target ? Math.min(100, Math.round(total/target*100)) : null;
  const bought = g.find(c=>c.bought);
  return `<div class="pot"><div class="pot-head"><span class="eyebrow">Cadeau commun</span><span class="pot-sum">${eur(total)}${target?` <span class="muted">/ ${eur(target)}</span>`:''}</span></div>
    ${pct!=null?`<div class="bar" role="img" aria-label="${pct} % réunis"><span style="width:${pct}%"></span></div>`:''}
    <div class="pot-who">${inside ? g.map(c=>`${esc(pname(c.uid))} ${eur(+c.amount||0)}`).join(' · ') : (() => { const vis = g.filter(c => c.show), hid = g.length - vis.length;
      return [...vis.map(c => `${esc(pname(c.uid))} ${eur(+c.amount||0)}`), hid ? `${hid} participant${hid>1?'s':''} discret${hid>1?'s':''}` : ''].filter(Boolean).join(' · '); })()}${target && total<target?` · <b>il manque ${eur(target-total)}</b>`:''}</div>
    ${bought ? `<div class="status mine">${inside || bought.show ? 'Acheté par ' + esc(pname(bought.uid)) : 'Acheté'}</div>` : ''}
    ${inside && debts.length?`<div class="pot-who">Remboursements : ${debts.map(d=>`${esc(pname(d.uid))} ${d.paid?'✓':'<b>doit '+eur(d.amount)+'</b>'}`).join(' · ')}</div>`:''}</div>`;
}
function wishHTML(w, p){
  const occ = w.occasion || 'both', own = isMe(p), by = reservedBy(w), g = groupOf(w), k = esc(wishKey(w));
  const inGroup = g.find(c=>c.uid===S.uid);
  let status = '';
  if(!own && S.members[S.uid]){
    if(inPot(w)) status = `<button class="link-btn" data-action="open-fete" data-id="a:${esc(w.personId)}">Choisi pour la cagnotte d’anniversaire ›</button>`;
    else if(g.length) status = inGroup ? `<span class="status mine">Ta part : ${eur(+inGroup.amount||0)}</span> <button class="link-btn" data-action="join-group" data-id="${k}">Modifier</button>`
      : `<button class="btn small" data-action="join-group" data-id="${k}">Participer</button>`;
    else if(!by) status = `<button class="btn small ghost" data-action="join-group" data-id="${k}">À plusieurs</button> <button class="btn small" data-action="reserve" data-id="${k}">Je l’offre</button>`;
    else if(by === S.uid){ const mineC = soloClaim(w);
      status = `<span class="status mine">Tu l’offres</span> <button class="vis ${mineC?.show?'on':''}" data-action="toggle-show" data-id="${k}" title="Qui voit ton nom ?">${mineC?.show?'Nom visible':'Discret'}</button> <button class="link-btn" data-action="unreserve" data-id="${k}">Annuler</button>`; }
    else { const c = soloClaim(w); status = `<span class="status other">Réservé${c && c.show ? ' par ' + esc(pname(c.uid)) : ''}</span>`; }
  } else if(!own && (isTaken(w) || inPot(w))) status = `<span class="status other">Réservé</span>`;
  const taken = !own && by && by !== S.uid;
  return `<article class="wish ${taken?'taken':''} ${w.fav?'fav':''}">
    ${w.fav?`<div class="fav-tag">Coup de cœur</div>`:''}
    <div class="wish-top"><div class="wish-title">${esc(w.title)}</div>${w.price?`<div class="wish-price">${esc(priceLabel(w.price))}</div>`:''}</div>
    ${!own ? groupHTML(w) : ''}
    ${w.note?`<div class="wish-note">${esc(w.note)}</div>`:''}
    <div class="wish-foot"><div class="tags"><span class="tag-occ ${occ}">${OCC[occ]}</span>${w.cat?`<span class="tag-cat">${esc(w.cat)}</span>`:''}${w.link?`<a href="${esc(w.link)}" target="_blank" rel="noopener">Voir le lien ↗</a>`:''}
      ${canEdit(p)?`<button class="link-btn" data-action="edit-wish" data-id="${esc(w.id)}">Modifier</button><button class="link-btn" data-action="mark-received" data-id="${esc(w.id)}">${S.confirm==='rcv:'+w.id?'Confirmer : je l’ai reçu':'Je l’ai reçu'}</button>`:''}</div><div>${status}</div></div></article>`;
}

/* ---------- Univers (catégories d'idées) ---------- */
const CATS = ['Foot','Sport','Plein air','Cuisine','Gourmandises','Lecture','Jeux et jouets','Tech','Mode','Maison et déco','Bien-être','Musique','Loisirs créatifs','Expériences'];
const CAT_WORDS = [
  [/foot|crampon|\bol\b|psg|ballon/i,'Foot'], [/rando|camping|sac à dos|trail|vélo|montagne/i,'Plein air'],
  [/running|tennis|fitness|haltère|sport/i,'Sport'], [/cuisine|couteau|poêle|casserole|robot/i,'Cuisine'],
  [/thé|café|chocolat|vin|whisky|biscuit/i,'Gourmandises'], [/livre|roman|\bbd\b|album|manga|liseuse/i,'Lecture'],
  [/lego|jeu|jouet|puzzle|playmobil|peluche/i,'Jeux et jouets'], [/casque|écouteur|airpods|console|montre connectée|enceinte|téléphone|switch/i,'Tech'],
  [/basket|maillot|pull|veste|chaussure|sac|bijou|montre|écharpe|bonnet/i,'Mode'], [/plaid|plante|monstera|déco|vase|coussin|lampe/i,'Maison et déco'],

  [/peinture|dessin|carnet|tricot|poterie|feutre/i,'Loisirs créatifs'], [/cours|atelier|bon cadeau|places?|abonnement|voyage/i,'Expériences']];
const guessCat = t => (CAT_WORDS.find(([re]) => re.test(t||'')) || [,''])[1];
const normCat = c => { c = (c||'').trim(); return c ? c.charAt(0).toUpperCase() + c.slice(1) : ''; };
function catOptions(){ const s = new Set(CATS); allWishes().forEach(w => w.cat && s.add(w.cat)); return [...s].sort((a,b)=>a.localeCompare(b,'fr')).map(c=>`<option value="${esc(c)}"></option>`).join(''); }
function universHTML(p, own){
  const counts = {};
  allWishes().filter(w => w.personId===p.id && w.cat).forEach(w => counts[w.cat] = (counts[w.cat]||0) + 1);
  const cats = Object.entries(counts).sort((a,b)=>b[1]-a[1] || a[0].localeCompare(b[0],'fr'));
  if(!cats.length) return '';
  const open = p.open !== false, canGift = !own && open && S.members[S.uid];
  const plans = own ? [] : Object.entries(S.resa).flatMap(([uid,r]) => Object.values(r.extras||{}).filter(x => x.to===p.id && x.cat).map(x => ({uid, cat:x.cat, show:!!x.show})));
  const who = own ? 'Tes' : 'Ses';

    <div class="chips">${cats.map(([c,n]) => canGift

/* ---------- Mes achats ---------- */
function myLines(){
  const r = myResa(), lines = [];
  for(const [k,v] of Object.entries(r.items)){
    const it = normItem(v); if(!it) continue;
    const w = allWishes().find(x => wishKey(x)===k);
    const gs = it.mode==='group' && w ? groupState(w) : null;
    lines.push({ src:'item', key:k, to:w?.personId || null, title: w ? w.title : 'Idée retirée de sa liste', group: it.mode==='group',
      amount: it.mode==='group' ? (+it.amount||0) : parsePrice(w?.price),
      bought: it.mode==='group' ? !!gs?.buyer : !!it.bought, boughtBy: it.mode==='group' ? (gs?.buyer?.uid || null) : (it.bought ? S.uid : null),
      show: !!it.show, given: !!it.given || !!w?.received, givenAt: it.givenAt || w?.receivedAt || null, lockedGiven: !!w?.received, gone: !w });
  }
  for(const [id,x] of Object.entries(r.extras)) lines.push({ src:'extra', key:id, to:x.to, title:x.title, cat:x.cat, amount:parsePrice(x.price), bought:!!x.bought, boughtBy: x.bought ? S.uid : null, show: !!x.show, given: !!x.given, givenAt: x.givenAt || null });
  return lines;
}
function viewAchats(){
  if(!S.members[S.uid]) return `<div class="empty"><h3>Connecte-toi</h3>Tes achats apparaîtront ici une fois ton profil créé.</div>`;
  const allLines = myLines();
  const lines = allLines.filter(l => !l.given), done = allLines.filter(l => l.given);
  const planned = lines.reduce((s,l)=>s+(l.amount||0),0), spent = lines.filter(l=>l.bought).reduce((s,l)=>s+(l.amount||0),0);
  const left = lines.filter(l=>!l.bought).length;
  const hints = S.draws.map(d => S.opened[drawKey(d)]).filter(to => to && to!=='err' && person(to) && !allLines.some(l=>l.to===to))
    .map(to => `<p class="note">Tirage : tu offres à <b>${esc(pname(to))}</b> mais rien n’est encore prévu. <button class="link-btn" data-action="open-person" data-id="${esc(to)}">Voir sa liste</button></p>`).join('');
  const head = `<div class="sec-head"><h2>Mes achats</h2><button class="btn small" data-action="add-extra">+ Hors liste</button></div>
    <p class="lock">${ICON.lock}<span>Cette page ne montre que tes propres achats. Les autres ne voient que « réservé ».</span></p>`;
  const extra = settlementsHTML() + givenHTML(done);
  if(!lines.length) return head + hints + extra + `<div class="empty"><h3>Rien de prévu pour l’instant</h3>Réserve une idée avec « Je l’offre » ou « À plusieurs » sur la liste de quelqu’un. Tu peux aussi noter un cadeau qui n’est sur aucune liste.<br><button class="btn" data-action="add-extra">Ajouter un cadeau hors liste</button></div>`;
  const groups = {};
  lines.forEach(l => { (groups[l.to || '?'] ||= []).push(l); });
  const order = Object.keys(groups).sort((a,b)=>pname(a).localeCompare(pname(b),'fr'));
  return head + `<div class="stats">
      <div><span class="eyebrow">Prévu</span><b>${eur(planned)}</b></div>
      <div><span class="eyebrow">Acheté</span><b>${eur(spent)}</b></div>
      <div><span class="eyebrow">À acheter</span><b>${left} cadeau${left>1?'x':''}</b></div></div>
    ${hints}
    ${settlementsHTML()}
    ${lines.some(l=>l.bought) ? `<div class="given-all"><button class="btn small ghost ${S.confirm==='given-all'?'armed':''}" data-action="given-all">${S.confirm==='given-all'?'Confirmer : tout ce qui est acheté a été offert':'Après la fête : marquer les achats comme offerts'}</button></div>` : ''}
    <div class="family">${order.map(to => `<div class="house"><div class="buy-for">Pour ${esc(to==='?'?'?':pname(to))}</div>
      ${groups[to].map(l => `<div class="buy-row ${l.bought?'done':''}">
        <button class="tick" data-action="toggle-bought" data-src="${l.src}" data-id="${esc(l.key)}" aria-pressed="${l.bought}" aria-label="Marquer comme acheté" ${l.group && l.boughtBy && l.boughtBy!==S.uid ? 'disabled' : ''}>${l.bought?'✓':''}</button>
        <div class="row-main"><div class="buy-title">${esc(l.title)}</div><div class="row-meta">${l.group ? (l.boughtBy ? (l.boughtBy===S.uid ? 'Cadeau commun · tu as avancé l’argent' : `Cadeau commun · acheté par ${esc(pname(l.boughtBy))}`) : 'Ta part d’un cadeau commun · coche si tu l’achètes') : l.src==='extra'?(l.cat?`Hors liste · univers ${esc(l.cat)}`:'Hors liste'):'Sur sa liste'}${!l.group && l.bought?' · acheté':''}${l.show?' · nom visible':' · discret'}</div></div>
        <div class="buy-price">${l.amount!=null?eur(l.amount):'—'}</div>
        ${l.bought?`<button class="link-btn" data-action="toggle-given" data-src="${l.src}" data-id="${esc(l.key)}">Offert</button>`:''}
        ${l.src==='extra'?`<button class="link-btn" data-action="edit-extra" data-id="${esc(l.key)}">Modifier</button>`:''}
        ${l.gone?`<button class="link-btn" data-action="drop-item" data-id="${esc(l.key)}">Retirer</button>`:''}
      </div>`).join('')}</div>`).join('')}</div>
    ${givenHTML(done)}`;
}

function settlementsHTML(){
  const rows = []; let owedToMe = 0, iOwe = 0;
  for(const w of allWishes()){
    const { buyer, debts } = groupState(w);
    if(!buyer || !debts.length) continue;
    const k = esc(wishKey(w)), label = `${esc(w.title)} · pour ${esc(pname(w.personId))}`;
    if(buyer.uid === S.uid){
      if(debts.every(d => d.paid)) continue;
      debts.forEach(d => {
        if(!d.paid) owedToMe += d.amount;
        rows.push(`<div class="buy-row ${d.paid?'done':''}"><div class="row-main"><div class="buy-title">${esc(pname(d.uid))} ${d.paid?'t’a remboursé':'te doit'} ${eur(d.amount)}</div><div class="row-meta">${label}</div></div>
          <button class="btn small ${d.paid?'ghost':''}" data-action="got-from" data-id="${k}" data-uid="${esc(d.uid)}">${d.paid?'Annuler':'Reçu'}</button></div>`);
      });
    } else {
      const mine = debts.find(d => d.uid === S.uid);
      if(!mine || mine.paid) continue;
      iOwe += mine.amount;
      rows.push(`<div class="buy-row"><div class="row-main"><div class="buy-title">Tu dois ${eur(mine.amount)} à ${esc(pname(buyer.uid))}</div><div class="row-meta">${label}</div></div>
        <button class="btn small" data-action="repaid" data-id="${k}">J’ai remboursé</button></div>`);
    }
  }
  evList().flatMap(ev => [ev + '@-1', ev]).forEach(kind => {
    const st = feteState(kind); if(!st || !st.buyer || !st.debts.length) return;
    const label = `${esc(st.short)} · cadeau pour ${esc(st.who)}`;
    if(st.buyer === S.uid){
      if(st.debts.every(d => d.paid)) return;
      st.debts.forEach(d => { if(!d.paid) owedToMe += d.amount;
        rows.push(`<div class="buy-row ${d.paid?'done':''}"><div class="row-main"><div class="buy-title">${esc(pname(d.uid))} ${d.paid?'t’a remboursé':'te doit'} ${eur(d.amount)}</div><div class="row-meta">${label}</div></div>
          <button class="btn small ${d.paid?'ghost':''}" data-action="fete-got" data-kind="${kind}" data-uid="${esc(d.uid)}">${d.paid?'Annuler':'Reçu'}</button></div>`); });
    } else {
      const mine = st.debts.find(d => d.uid === S.uid); if(!mine || mine.paid) return;

function rnd(n){ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function makePairs(ids, excl){
  const bad = new Set(); excl.forEach(({a,b}) => { bad.add(a+'>'+b); bad.add(b+'>'+a); });
  for(let t=0;t<5000;t++){
    const r=[...ids]; for(let i=r.length-1;i>0;i--){ const j=rnd(i+1); [r[i],r[j]]=[r[j],r[i]]; }
    if(ids.every((g,i)=> r[i]!==g && !bad.has(g+'>'+r[i]))) return ids.map((g,i)=>[g,r[i]]);
  }
  return null;
}
async function sealPairs(pairs, drawId){

}

function easter(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114; return new Date(y, Math.floor(n/31)-1, (n%31)+1); }
function feteMeres(y){ const d = new Date(y,5,0); d.setDate(d.getDate()-d.getDay()); const pent = easter(y); pent.setDate(pent.getDate()+49);
  if(d.getTime()===pent.getTime()){ const f = new Date(y,5,1); f.setDate(1+((7-f.getDay())%7)); return f; } return d; }
function fetePeres(y){ const f = new Date(y,5,1); f.setDate(1+((7-f.getDay())%7)+14); return f; }
/* ---------- Cagnottes : fête des mères / pères et anniversaires ----------
   Un « événement » (ev) : 'meres', 'peres' ou 'a:<id de la personne>' pour un anniversaire.
   Données : fetes/<clé>  (choix, acheteur, votes sur les idées de sa liste)
             fetes/<clé>/ideas/<id>  (idées proposées)   fetes/<clé>/parts/<uid>  (participation de chacun)
   La cagnotte d'anniversaire d'un adulte lui est cachée (règles Firebase + affichage). */
const FETES = { meres:{ label:'Fête des mères', who:'Maman' }, peres:{ label:'Fête des pères', who:'Papa' } };
S.fetes = {}; S.feteIdeas = {}; S.feteParts = {}; S.fete = null; S.evSubs = new Set();
function occurrence(fnYear){ const t = today(); let d = fnYear(t.getFullYear()); if(daysTo(d) < -30) d = fnYear(t.getFullYear()+1); return d; }
/* ev peut finir par « @-1 » : l'édition précédente (pour les remboursements pas encore réglés) */
function evInfo(ev){
  const [base, sh] = String(ev).split('@'), shift = +sh || 0;
  const at = fn => { const d = occurrence(fn); return shift ? fn(d.getFullYear() + shift) : d; };
  if(base === 'meres' || base === 'peres'){
    const d = at(base === 'meres' ? feteMeres : fetePeres);
    return { ev, base, shift, key: base + '-' + d.getFullYear(), date:d, label: FETES[base].label + ' ' + d.getFullYear(), short: FETES[base].label + (shift ? ' ' + d.getFullYear() : ''), who: FETES[base].who, editWho:true, pid:null };
  }
  const pid = base.slice(2), p = person(pid);
  if(!p || !p.birthday) return null;
  const [y,m,dd] = p.birthday.split('-').map(Number);
  const d = at(yr => new Date(yr, m-1, dd));
  return { ev, base, shift, key: `anniv-${pid}-${d.getFullYear()}`, date:d, label:`Anniversaire de ${p.name}`, short:`Anniversaire de ${p.name}` + (shift ? ' ' + d.getFullYear() : ''), who:p.name, age: y ? d.getFullYear()-y : null, editWho:false, pid, p };
}
const feteKey = ev => evInfo(ev)?.key;
/* Événements visibles pour moi : les deux fêtes + l'anniversaire de chacun sauf le mien */
/* Fête des mères / pères : réservée au groupe choisi par l'organisateur (config/family.feteMembers) */
const feteMembers = () => Array.isArray(S.famDoc && S.famDoc.feteMembers) ? S.famDoc.feteMembers : null;
const canFete = () => !feteMembers() || feteMembers().includes(S.uid);
function evList(){ return [...(canFete() ? ['meres','peres'] : []), ...people().filter(p => p.id !== S.uid && p.birthday).map(p => 'a:' + p.id)]; }
function ensureEvSubs(){
  if(!S.db || S.fam !== 'ok') return;
  for(const ev of evList()) for(const e of [ev, ev + '@-1']){
    const k = feteKey(e); if(!k || S.evSubs.has(k)) continue; S.evSubs.add(k);
    S.unsubs.push(S.db.doc('fetes/'+k).onSnapshot(sn => { S.fetes[k] = sn.exists ? sn.data() : {}; render(); }, ()=>{}));
    if(e === ev) S.unsubs.push(S.db.collection(`fetes/${k}/ideas`).onSnapshot(sn => { S.feteIdeas[k] = sn.docs.map(x=>({id:x.id, ...x.data()})); render(); }, ()=>{}));
    S.unsubs.push(S.db.collection(`fetes/${k}/parts`).onSnapshot(sn => { S.feteParts[k] = Object.fromEntries(sn.docs.map(x=>[x.id, x.data()])); render(); }, ()=>{}));
  }
}
function feteState(ev){
  const info = evInfo(ev); if(!info) return null;
  const k = info.key, f = S.fetes[k] || {}, parts = S.feteParts[k] || {};
  const contrib = Object.entries(parts).filter(([,p]) => (+p.amount||0) > 0).map(([uid,p]) => ({ uid, amount:+p.amount||0, repaid:!!p.repaid })).sort((a,b)=>pname(a.uid).localeCompare(pname(b.uid),'fr'));
  const total = contrib.reduce((s,c) => s + c.amount, 0);

  const cands = (S.feteIdeas[k] || []).map(i => ({ cid:'i:'+i.id, id:i.id, title:i.title, price:i.price, note:i.note, link:i.link, by:i.by, likes:i.likes||[], createdAt:i.createdAt||0, proposed:true }));
  if(info.pid){
    allWishes().filter(w => w.personId === info.pid && !isReceived(w) && ['both','anniv',undefined].includes(w.occasion)).forEach(w => {
      const cid = 'w:' + wishKey(w), by = reservedBy(w), grp = groupOf(w).length > 0;

  const chosenId = f.chosen ? (/^[iw]:/.test(f.chosen) ? f.chosen : 'i:' + f.chosen) : null;

  const givers = info.pid ? adults().filter(a => a.id !== info.pid) : adults().filter(a => !feteMembers() || feteMembers().includes(a.id));
  return { ...info, k, f, cands, parts, contrib, total, chosen, buyer, debts, givers, who: (info.editWho && f.who) || info.who };
}

    <span class="row-main"><span class="row-name">Noël</span><br><span class="row-meta">${S.draws.length?'Tirage fait':'Pas encore de tirage'}</span></span><span class="in soon">${inLabel(x.days)}</span></div>`});
  (canFete() ? ['meres','peres'] : []).forEach(kind => { const st = feteState(kind), d = st.date, n = daysTo(d);

function openSheet(html, mount){
  const root = document.getElementById('sheet-root');
  root.innerHTML = `<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  root.querySelector('.sheet-bg').addEventListener('click', e => { if(e.target.dataset.close) closeSheet(); });
  mount && mount(root.querySelector('.sheet'));
}
function closeSheet(){ document.getElementById('sheet-root').innerHTML=''; }
function armDelete(btn, label, fn){
  btn.addEventListener('click', async () => {
    if(!btn.classList.contains('armed')){ btn.classList.add('armed'); btn.textContent = label; return; }
    btn.disabled = true; await fn();
  });
}

  const as = adults();
  const t = today(); const yr = (t.getMonth()===11 && t.getDate()>25) ? t.getFullYear()+1 : t.getFullYear();
  let excl = [];
  const ready = as.filter(a=>a.pubKey);
  const opts = sel => ready.map(a=>`<option value="${a.id}" ${a.id===sel?'selected':''}>${esc(a.name)}</option>`).join('');
  openSheet(`<h2>Nouveau tirage</h2><form class="form" id="df">
      <div class="field"><label for="d-name">Nom</label><input type="text" id="d-name" maxlength="50" value="Noël ${yr}"></div>
      <div class="field"><label for="d-budget">Budget par cadeau (facultatif)</label><input type="text" id="d-budget" maxlength="30" placeholder="Ex. 50 €"></div>
      <div class="field"><span class="lab">Participants</span><div class="checks">
        ${as.map(a=>`<label class="check"><input type="checkbox" id="d-p-${a.id}" value="${a.id}" ${a.pubKey?'checked':'disabled'}> ${esc(a.name)}${a.pubKey?'':' <span class="muted">(profil incomplet)</span>'}</label>`).join('')}</div></div>
      <div class="field"><span class="lab">Ne doivent pas se tirer entre eux (couples…)</span><div id="d-excl" class="checks"></div>
        <button type="button" class="link-btn" id="d-add-excl" style="align-self:flex-start">+ Ajouter une exclusion</button></div>
      <p class="lock">${ICON.lock}<span>Les résultats sont chiffrés tout de suite. Même toi, tu ne verras que le tien.</span></p>
      <div class="err" id="d-err" hidden></div>
      <div class="form-actions"><div class="right"><button type="button" class="btn ghost" onclick="closeSheet()">Annuler</button><button class="btn" type="submit" id="d-go">Tirer au sort</button></div></div>
    </form>`, sh => {
    const box = sh.querySelector('#d-excl');
    const draw = () => { box.innerHTML = excl.map((e,i)=>`<div class="excl"><select id="d-ex-a-${i}" data-i="${i}" data-k="a">${opts(e.a)}</select><span class="muted">et</span><select id="d-ex-b-${i}" data-i="${i}" data-k="b">${opts(e.b)}</select><button type="button" class="link-btn" data-rm="${i}" aria-label="Retirer">✕</button></div>`).join(''); };
    box.addEventListener('change', e => { const s=e.target; if(s.dataset.i!=null) excl[+s.dataset.i][s.dataset.k]=s.value; });
    box.addEventListener('click', e => { const b=e.target.closest('[data-rm]'); if(b){ excl.splice(+b.dataset.rm,1); draw(); } });
    sh.querySelector('#d-add-excl').addEventListener('click', () => { if(ready.length<2) return; excl.push({a:ready[0].id, b:ready[1].id}); draw(); });
    sh.querySelector('#df').addEventListener('submit', async e => {
      e.preventDefault();
      const err = sh.querySelector('#d-err'); err.hidden = true;
      const ids = ready.map(a=>a.id).filter(id => sh.querySelector('#d-p-'+id).checked);
      if(ids.length < 2){ err.textContent='Coche au moins deux participants.'; err.hidden=false; return; }
      const ex = excl.filter(({a,b}) => a!==b && ids.includes(a) && ids.includes(b));
      const pairs = makePairs(ids, ex);
      if(!pairs){ err.textContent='Aucune répartition possible avec ces exclusions. Retire-en une ou ajoute un participant.'; err.hidden=false; return; }
      const go = sh.querySelector('#d-go'); go.disabled = true; go.textContent = 'Chiffrement…';
      const ref = S.db.collection('draws').doc();
      const ok = await write(async () => {
        const sealed = await sealPairs(pairs, ref.id);
        await ref.set({ name: sh.querySelector('#d-name').value.trim() || `Noël ${yr}`, budget: sh.querySelector('#d-budget').value.trim(),
          participants: ids, exclusions: ex, sealed, createdAt: Date.now(), redoneAt: null, by: S.uid });
      }, 'Tirage fait. Chacun peut tirer son papier.');
      if(ok) closeSheet(); else { go.disabled=false; go.textContent='Tirer au sort'; }
    });
  });
}
async function redoDraw(d){
  const ids = (d.participants||[]).filter(id => S.members[id]?.pubKey);
  if(ids.length < 2){ toast('Plus assez de participants pour refaire ce tirage.'); return; }
  const pairs = makePairs(ids, (d.exclusions||[]).filter(({a,b})=>ids.includes(a)&&ids.includes(b)));
  if(!pairs){ toast('Impossible de refaire ce tirage avec ses exclusions.'); return; }
  await write(async () => {
    const sealed = await sealPairs(pairs, d.id);
    await S.db.doc('draws/'+d.id).update({ participants: ids, sealed, redoneAt: Date.now() });
  }, 'Nouveau tirage fait. Chacun doit retirer son papier.');
}

/* ---------- Réservations ---------- */
async function setResa(key, on){
  const r = myResa();
  if(on) r.items[key] = { mode:'solo', show: showDefault() }; else delete r.items[key];
  await saveResa(r, on ? 'Réservé à ton nom' : 'Réservation annulée');
}
async function toggleGiven(src, key){
  const r = myResa();
  if(src==='extra'){ const x = r.extras[key]; if(!x) return; r.extras[key] = { ...x, given: !x.given, givenAt: x.given ? null : Date.now() }; }
  else { const it = normItem(r.items[key]); if(!it) return; r.items[key] = { ...it, given: !it.given, givenAt: it.given ? null : Date.now() }; }
  await saveResa(r, 'Mis à jour');
}
async function toggleBought(src, key){
  const r = myResa();
  if(src==='extra'){ if(!r.extras[key]) return; r.extras[key] = { ...r.extras[key], bought: !r.extras[key].bought }; }
  else {
    const it = normItem(r.items[key]); if(!it) return;
    if(it.mode==='group' && !it.bought){ const w = allWishes().find(x => wishKey(x)===key); const b = w && groupState(w).buyer; if(b && b.uid !== S.uid){ toast(`Déjà acheté par ${pname(b.uid)}`); return; } }
    r.items[key] = { ...it, bought: !it.bought };
  }
  await saveResa(r);
}

/* ---------- Actions ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]'); if(!el || el.closest('#sheet-root')) return;
  const a = el.dataset.action, id = el.dataset.id;
  const needConfirm = { redo:'redo:', 'del-draw':'del:', 'mark-received':'rcv:', 'given-all':'given-all' };
  const ck = a==='given-all' ? 'given-all' : (needConfirm[a] ? needConfirm[a]+id : null);
  if(ck && S.confirm !== ck){ S.confirm = ck; render(); return; }
  S.confirm = null;
  switch(a){
    case 'tab': S.tab = el.dataset.tab; S.personId=null; S.from=null; S.fete=null; render(); window.scrollTo(0,0); break;
    case 'open-fete': S.feteBack = S.personId ? { personId:S.personId } : null; if(!S.personId) S.tab='dates'; S.fete=id; render(); window.scrollTo(0,0); break;
    case 'fete-back': S.fete=null; S.feteBack=null; render(); window.scrollTo(0,0); break;
    case 'fete-part': feteSheetPart(el.dataset.kind || S.fete); break;
    case 'fete-who': feteSheetWho(S.fete); break;
    case 'fete-members': feteMembersSheet(); break;
    case 'fete-idea': feteSheetIdea(S.fete, null); break;
    case 'fete-idea-edit': feteSheetIdea(S.fete, id); break;
    case 'fete-like': { const st = feteState(S.fete), c = st && st.cands.find(x=>x.cid===id); if(!c) break;
      const likes = c.likes.includes(S.uid) ? c.likes.filter(u=>u!==S.uid) : [...c.likes, S.uid];
      if(c.proposed) await write(()=>S.db.doc(`fetes/${st.k}/ideas/${c.id}`).update({ likes }));
      else await feteSet(S.fete, { likes: { [c.cid]: likes } });
      break; }
    case 'fete-choose': await feteSet(S.fete, { chosen:id }, 'Cadeau choisi'); break;
    case 'fete-unchoose': await feteSet(S.fete, { chosen:null, buyer:null, bought:false }, 'Choix annulé'); break;
    case 'fete-buy': await feteSet(S.fete, { buyer:S.uid, bought:false }, 'C’est toi qui l’achètes'); break;
    case 'fete-unbuy': await feteSet(S.fete, { buyer:null, bought:false }, 'Annulé'); break;
    case 'fete-bought': { const st = feteState(S.fete); await feteSet(S.fete, { bought: !st.f.bought }, st.f.bought ? 'Annulé' : 'Acheté : les remboursements apparaissent'); break; }
    case 'fete-got': { const kind = el.dataset.kind || S.fete, st = feteState(kind), u = el.dataset.uid;
      await feteSet(kind, { gotFrom: { [u]: !(st.f.gotFrom||{})[u] } }, 'Mis à jour'); break; }
    case 'fete-repaid': { const kind = el.dataset.kind || S.fete, st = feteState(kind), mine = st.parts[S.uid] || {};
      await write(()=>S.db.doc(`fetes/${st.k}/parts/${S.uid}`).set({ repaid: !mine.repaid }, { merge:true }), 'Remboursement noté'); break; }
    case 'open-person': S.fete = null; S.feteBack = null; if(!S.personId){ S.from = S.tab; S.scrollBack = window.scrollY; } S.tab='listes'; S.personId=id; S.filter='all'; render(); window.scrollTo(0,0); break;
    case 'back': S.tab = S.from || 'listes'; S.personId=null; S.from=null; render(); window.scrollTo(0, S.scrollBack||0); S.scrollBack=0; break;
    case 'filter': S.filter=el.dataset.f; render(); break;
    case 'edit-me': personSheet('me', S.members[S.uid]); break;
    case 'google': googleLogin(); break;
    case 'logout': auth.signOut(); break;
    case 'verified': await checkVerified(); break;
    case 'resend': try{ await auth.currentUser.sendEmailVerification(); toast('E-mail renvoyé'); }catch(e){ toast(AUTH_ERR[e.code] || 'Envoi impossible pour le moment.'); } break;
    case 'access': accessSheet(); break;
    case 'claim-admin': await write(()=>S.db.doc('config/family').set({ admins:[S.email], emails:[] }), 'Tu es l’organisateur'); break;
    case 'add-kid': personSheet('kid', null); break;
    case 'edit-kid': personSheet('kid', person(id)); break;
    case 'add-wish': wishSheet(id, null); break;
    case 'edit-wish': { const w=(S.wishes[S.uid]||[]).find(x=>x.id===id); if(w) wishSheet(w.personId, w); break; }
    case 'reserve': { const w = allWishes().find(x=>wishKey(x)===id); if(w && !isTaken(w)) await setResa(id, true); break; }
    case 'unreserve': await setResa(id, false); break;
    case 'toggle-show': { const r = myResa(), it = normItem(r.items[id]); if(!it) break;
      r.items[id] = { ...it, show: !it.show }; await saveResa(r, it.show ? 'Discret : ton nom est caché' : 'Ton nom est visible'); break; }
    case 'join-group': groupSheet(id); break;
    case 'toggle-bought': await toggleBought(el.dataset.src, id); break;
    case 'toggle-given': await toggleGiven(el.dataset.src, id); break;
    case 'given-all': {
      const r = myResa(); const now = Date.now();
      for(const l of myLines()) if(l.bought && !l.given){
        if(l.src==='extra' && r.extras[l.key]) r.extras[l.key] = { ...r.extras[l.key], given:true, givenAt:now };
        else if(l.src==='item'){ const it = normItem(r.items[l.key]); if(it) r.items[l.key] = { ...it, given:true, givenAt:now }; }
      }
      await saveResa(r, 'Cadeaux marqués comme offerts'); break; }
    case 'got-from': {
      const r = myResa(); const it = normItem(r.items[id]); if(!it) break;
      const gf = { ...(it.gotFrom||{}) }; const u = el.dataset.uid;
      if(gf[u]) delete gf[u]; else gf[u] = true;
      r.items[id] = { ...it, gotFrom: gf }; await saveResa(r, gf[u] ? 'Remboursement noté' : 'Annulé'); break; }
    case 'repaid': {
      const r = myResa(); const it = normItem(r.items[id]); if(!it) break;
      r.items[id] = { ...it, repaid: !it.repaid }; await saveResa(r, 'Remboursement noté'); break; }
    case 'mark-received': await write(()=>S.db.doc(`members/${S.uid}/wishes/${id}`).update({ received:true, receivedAt:Date.now() }), 'Rangé dans « Déjà reçus »'); break;
    case 'unreceive': await write(()=>S.db.doc(`members/${S.uid}/wishes/${id}`).update({ received:false, receivedAt:null, restoredAt:Date.now() }), 'Remis dans la liste'); break;
    case 'drop-item': { const r = myResa(); delete r.items[id]; await saveResa(r, 'Retiré'); break; }
    case 'add-extra': extraSheet(null); break;
    case 'univers-gift': extraSheet(null, { to:id, cat:el.dataset.cat }); break;
    case 'edit-extra': extraSheet(id); break;
    case 'new-draw': drawSheet(); break;
    case 'reveal': { const d=S.draws.find(x=>x.id===id); if(d) await openPaper(d); break; }
    case 'redo': { const d=S.draws.find(x=>x.id===id); if(d) await redoDraw(d); break; }
    case 'del-draw': await write(()=>S.db.doc('draws/'+id).delete(), 'Tirage supprimé'); break;
    default: render();
  }
});

const CONFIGURED = !String(firebaseConfig.apiKey).startsWith('A_REMPLIR');
let auth = null;
S.hist = new Set();
document.addEventListener('toggle', e => { const k = e.target && e.target.dataset && e.target.dataset.hist; if(!k) return; if(e.target.open) S.hist.add(k); else S.hist.delete(k); }, true);
S.unsubs = []; S.fam = null; S.famDoc = null; S.isAdmin = false; S.authReady = false; S.email = '';

function stopData(){
  S.unsubs.forEach(u => { try{ u(); }catch(e){} }); S.unsubs = [];
  S.subs = new Set(); S.members = {}; S.kids = {}; S.wishes = {}; S.resa = {}; S.draws = [];
  S.loaded = { members:false, resa:false, draws:false }; S.priv = null; S.privChecked = false; S.opened = {}; S.opening = {};
  S.offline = false; S.personId = null; S.tab = 'listes'; S.fetes = {}; S.feteIdeas = {}; S.feteParts = {}; S.fete = null; S.feteBack = null; S.evSubs = new Set();
}
function subMember(uid){
  if(S.subs.has(uid)) return; S.subs.add(uid);
  S.unsubs.push(S.db.collection(`members/${uid}/kids`).onSnapshot(s => { S.kids[uid] = s.docs.map(d=>({id:d.id, ...d.data()})); ensureEvSubs(); render(); }, ()=>{}));
  S.unsubs.push(S.db.collection(`members/${uid}/wishes`).onSnapshot(s => { S.wishes[uid] = s.docs.map(d=>({id:d.id, ...d.data()})); render(); }, ()=>{}));
}
async function startData(){
  const db = S.db;
  try{ await loadPriv(); S.privChecked = true; }catch(e){}
  const onErr = () => { S.offline = true; render(); };
  S.unsubs.push(db.collection('members').onSnapshot(async s => {
    S.members = Object.fromEntries(s.docs.map(d => [d.id, d.data()]));
    S.loaded.members = true;
    Object.keys(S.members).forEach(subMember);
    ensureEvSubs();
    const mine = S.members[S.uid];
    if(mine && !S.priv && S.privChecked && !S.busy){ // profil sans clé privée : on en recrée une
      S.busy = true; await write(async () => { const pub = await newKeys(); await db.doc('members/'+S.uid).update({ pubKey: pub }); }); S.busy = false;
    }
    render();
  }, onErr));
  ensureEvSubs();
  S.unsubs.push(db.collection('resa').onSnapshot(s => { S.resa = Object.fromEntries(s.docs.map(d=>[d.id, d.data()])); S.loaded.resa = true; render(); }, onErr));
  S.unsubs.push(db.collection('draws').onSnapshot(s => {
    S.draws = s.docs.map(d => ({id:d.id, ...d.data()})); S.loaded.draws = true;
    for(const d of S.draws){ const k = drawKey(d); if(S.uid && d.sealed?.[S.uid] && !S.opened[k] && LS.get('cf_open_'+k)) openPaper(d); }
    render();
  }, onErr));
}

/* Écrans avant l'appli */
function gateView(){
  if(!CONFIGURED) return `<section class="welcome"><h2>Configuration à terminer</h2><p>Il manque la configuration Firebase dans ce fichier. Envoie-la à Claude pour qu’il la mette en place.</p></section>`;
  if(!S.authReady) return `<div class="loading">Connexion…</div>`;
  if(!S.user) return `<section class="welcome"><h2>Connexion</h2>
      <p>Connecte-toi pour voir les listes de la famille. La première fois, choisis « Créer un compte ».</p>
      
      <form class="form" id="lf">
        <div class="field"><label for="lf-email">E-mail</label><input type="email" id="lf-email" required autocomplete="email" inputmode="email"></div>
        <div class="field"><label for="lf-pass">Mot de passe (6 caractères minimum)</label><input type="password" id="lf-pass" required minlength="6" autocomplete="current-password"></div>
        <div class="err" id="lf-err" hidden></div>
        <div class="form-actions"><button type="button" class="link-btn" id="lf-forgot">Mot de passe oublié ?</button>
          <div class="right"><button type="button" class="btn ghost" id="lf-new">Créer un compte</button><button class="btn" type="submit">Se connecter</button></div></div>
      </form></section>`;
  if(S.fam === 'verify') return `<section class="welcome"><h2>Vérifie ton e-mail</h2>
      <p>Un lien de confirmation a été envoyé à <b>${esc(S.email)}</b>. Clique dessus (regarde aussi dans les spams), puis reviens ici.</p>
      <div class="form-actions"><button class="btn ghost" data-action="resend">Renvoyer l’e-mail</button><button class="btn" data-action="verified">J’ai cliqué sur le lien</button></div>
      <p class="muted" style="margin-top:14px"><button class="link-btn" data-action="logout">Se déconnecter</button></p></section>`;
  if(S.fam === null) return `<div class="loading">Vérification de l’accès…</div>`;
  if(S.fam === 'missing') return `<section class="welcome"><h2>Première connexion</h2>
      <p>Tu es la première personne connectée : tu deviens l’organisateur. Tu pourras ensuite autoriser les adresses e-mail de ta famille.</p>
      <button class="btn" data-action="claim-admin">Devenir l’organisateur</button>
      <p class="muted" style="margin-top:14px">Connecté avec ${esc(S.email)} · <button class="link-btn" data-action="logout">Se déconnecter</button></p></section>`;
  if(S.fam === 'denied') return `<section class="welcome"><h2>Accès en attente</h2>
      <p>Ton adresse n’est pas encore autorisée. Envoie-la à l’organisateur pour qu’il l’ajoute :</p>
      <p class="addr">${esc(S.email)}</p>
      <p class="muted">La page s’ouvrira toute seule dès que ce sera fait.</p>
      <button class="btn ghost" data-action="logout">Se déconnecter</button></section>`;
  if(S.fam === 'error') return `<div class="empty"><h3>Connexion impossible</h3>Vérifie ta connexion internet, puis recharge la page.</div>`;
  return null;
}
const AUTH_ERR = {
  'auth/invalid-credential':'E-mail ou mot de passe incorrect.', 'auth/wrong-password':'E-mail ou mot de passe incorrect.',
  'auth/user-not-found':'Aucun compte avec cet e-mail. Choisis « Créer un compte ».', 'auth/email-already-in-use':'Un compte existe déjà avec cet e-mail : clique sur « Se connecter ».',
  'auth/weak-password':'Mot de passe trop court : 6 caractères minimum.', 'auth/invalid-email':'Adresse e-mail invalide.',
  'auth/network-request-failed':'Pas de connexion internet.', 'auth/too-many-requests':'Trop d’essais. Réessaie dans quelques minutes.',
  'auth/popup-blocked':'La fenêtre Google a été bloquée. Utilise la connexion par e-mail.', 'auth/operation-not-supported-in-this-environment':'Connexion Google impossible ici. Utilise la connexion par e-mail.',
  'auth/unauthorized-domain':'Cette adresse n’est pas encore autorisée dans Firebase.'
};
function mountAuth(){
  const f = document.getElementById('lf'); if(!f || f.dataset.m) return; f.dataset.m = 1;
  const err = document.getElementById('lf-err');
  const show = e => { err.textContent = AUTH_ERR[e && e.code] || 'La connexion a échoué. Réessaie.'; err.hidden = false; };
  const vals = () => [document.getElementById('lf-email').value.trim(), document.getElementById('lf-pass').value];
  f.addEventListener('submit', async e => { e.preventDefault(); err.hidden = true; const [m,p] = vals(); try{ await auth.signInWithEmailAndPassword(m,p); }catch(x){ show(x); } });
  document.getElementById('lf-new').addEventListener('click', async () => {
    err.hidden = true; const [m,p] = vals();
    if(!m || p.length < 6){ err.textContent = 'Indique ton e-mail et un mot de passe de 6 caractères minimum.'; err.hidden = false; return; }
    try{ const c = await auth.createUserWithEmailAndPassword(m,p); await c.user.sendEmailVerification(); }catch(x){ show(x); }
  });
  document.getElementById('lf-forgot').addEventListener('click', async () => {
    const [m] = vals(); err.hidden = true;
    if(!m){ err.textContent = 'Indique d’abord ton e-mail.'; err.hidden = false; return; }
    try{ await auth.sendPasswordResetEmail(m); toast('E-mail de réinitialisation envoyé'); }catch(x){ show(x); }
  });
}
async function googleLogin(){
  try{ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
  catch(e){ if(e && e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast(AUTH_ERR[e.code] || 'Connexion Google impossible. Utilise la connexion par e-mail.'); }
}

function accessSheet(){
  const d = S.famDoc || {}; const admins = d.admins || [], emails = d.emails || [];
  const row = (m, admin) => `<div class="acc-row"><span class="acc-mail">${esc(m)}</span>${admin ? '<span class="muted">organisateur</span>' : `<button type="button" class="link-btn" data-rm="${esc(m)}">Retirer</button>`}</div>`;
  openSheet(`<h2>Accès de la famille</h2>
    <p class="muted" style="margin:-6px 0 14px">Seules ces adresses peuvent ouvrir l’appli. Chacun se connecte avec cette adresse (compte Google ou e-mail + mot de passe).</p>
    <div class="acc-list">${admins.map(m=>row(m,true)).join('')}${emails.map(m=>row(m,false)).join('')}</div>
    <form class="form" id="af" style="margin-top:16px">
      <div class="field"><label for="af-mail">Ajouter une adresse</label><input type="email" id="af-mail" required placeholder="prenom@gmail.com" autocomplete="off" inputmode="email"></div>
      <div class="form-actions"><div class="right"><button type="button" class="btn ghost" onclick="closeSheet()">Fermer</button><button class="btn" type="submit">Autoriser</button></div></div>
    </form>`, sh => {
    sh.querySelector('#af').addEventListener('submit', async e => {
      e.preventDefault();
      const m = sh.querySelector('#af-mail').value.trim().toLowerCase(); if(!m) return;
      if(admins.includes(m) || emails.includes(m)){ toast('Adresse déjà autorisée'); return; }
      if(await write(()=>S.db.doc('config/family').update({ emails: [...emails, m] }), `${m} autorisé`)) accessSheet();
    });
    sh.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', async () => {
      if(!b.classList.contains('armed')){ b.classList.add('armed'); b.textContent = 'Confirmer'; return; }
      if(await write(()=>S.db.doc('config/family').update({ emails: emails.filter(x => x !== b.dataset.rm) }), 'Accès retiré')) accessSheet();
    }));
  });
}

  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  S.db = firebase.firestore();
  auth.onAuthStateChanged(onUser);
}
function onUser(u){
    if(S.famUnsub){ S.famUnsub(); S.famUnsub = null; }
    stopData();
    S.user = u || null; S.uid = u ? u.uid : null; S.email = u ? (u.email || '').toLowerCase() : '';
    S.authReady = true; S.fam = null; S.isAdmin = false;
    if(u && !u.emailVerified){ S.fam = 'verify'; render(); return; }
    render();
    if(!u) return;
    S.famUnsub = S.db.doc('config/family').onSnapshot(async snap => {
      if(!snap.exists){ S.fam = 'missing'; S.famDoc = null; stopData(); render(); return; }
      const d = snap.data(); S.famDoc = d;
      S.isAdmin = (d.admins || []).includes(S.email);
      const ok = S.isAdmin || (d.emails || []).includes(S.email);
      if(!ok){ if(S.fam === 'ok') stopData(); S.fam = 'denied'; render(); return; }
      if(S.fam !== 'ok'){ S.fam = 'ok'; render(); await startData(); }
      render();
    }, () => { S.fam = 'error'; render(); });
}
async function checkVerified(){
  const u = auth.currentUser; if(!u) return;
  try{ await u.reload(); }catch(e){}
  if(auth.currentUser.emailVerified){ await auth.currentUser.getIdToken(true); onUser(auth.currentUser); }
  else toast('Pas encore vérifié : clique sur le lien reçu par e-mail.');
}
